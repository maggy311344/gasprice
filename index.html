<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動化油價與匯率分析儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .banner { border-left: 5px solid #22c55e; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .score { font-size: 2.5rem; font-weight: bold; color: #22c55e; }
        .chart-box { height: 350px; position: relative; }
    </style>
</head>
<body>
    <h1>⛽ 全自動油價與匯率追蹤儀表板</h1>
    <p style="color: #94a3b8;">上次更新時間：<span id="updateTime">讀取中...</span></p>

    <!-- 頂部自動評價結果 -->
    <div class="banner">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 id="strategyStatus" style="color:#22c55e; margin-bottom: 8px;">資料加載中...</h2>
                <div id="strategyDesc" style="color: #94a3b8;">系統正在獲取最新原油與匯率評價</div>
            </div>
            <div style="text-align: center;">
                <div id="recommendScore" class="score">--</div>
                <div style="font-size: 0.8rem; color: #94a3b8;">加油推薦指數</div>
            </div>
        </div>
    </div>

    <!-- 預測圖表 -->
    <div class="card">
        <h3>📊 未來 14 天綜合趨勢預測圖</h3>
        <div class="chart-box">
            <canvas id="predChart"></canvas>
        </div>
    </div>

    <script>
        let chartInstance = null;

        // 頁面載入時自動抓取 Python 生成的數據 json
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('updateTime').innerText = data.last_updated;
                document.getElementById('strategyStatus').innerText = data.evaluation.recommendation;
                document.getElementById('strategyDesc').innerText = data.evaluation.oil_status;
                document.getElementById('recommendScore').innerText = data.evaluation.score + "分";

                const ctx = document.getElementById('predChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.chart_data.labels,
                        datasets: [
                            { label: '預估本地零售價', data: data.chart_data.retail_prices, borderColor: '#38bdf8', borderWidth: 3 },
                            { label: '國際原油原料成本', data: data.chart_data.oil_costs, borderColor: '#f59e0b', borderDash: [5,5] },
                            { label: '加油推薦指數', data: data.chart_data.scores, type: 'bar', backgroundColor: 'rgba(34, 197, 94, 0.2)', borderColor: '#22c55e' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            })
            .catch(err => {
                document.getElementById('strategyStatus').innerText = "⚠️ 尚未讀取到數據檔案，請確認自動化腳本已執行成功。";
            });
    </script>
</body>
</html>
